name: Deploy to simply.com

on:
  push:
    branches: [main]
    paths: ['site/**', 'deploy.sh', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload site/ to tibi-lab.com (FTPS)
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: ./deploy.sh
